# Spectrum — theme defaults.
#
# Nothing here is consumed from another repository. Spectrum and Pulse are
# siblings, not layers: neither builds on the other. What the theme does
# expect of a site it is installed in — a `posts` section, `tags` and
# `archives` taxonomies, archive URLs, and a timezone — is in README.md
# under "The content model".

[params]
  # Overridden by the consuming site.
  tagline = ""

[params.spectrum]
  # The one knob that changes the whole palette.
  accentHue = 355
